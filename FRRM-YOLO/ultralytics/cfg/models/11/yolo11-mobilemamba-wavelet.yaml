# Parameters
nc: 80  # number of classes
depth_multiple: 0.50  
width_multiple: 0.25  

# Backbone
backbone:
  - [-1, 1, DWConvSep, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, DWConvSep, [128, 3, 2]]      # 1-P2/4
  - [-1, 2, C3k2_Mamba_Block, [128,  True, 1.0, True, True]]    # 2-P2/4
  - [-1, 1, DWConvSep, [256, 3, 2]]      # 3-P3/8
  - [-1, 2, C3k2_Mamba_Block, [256,  True, 1.0, True, True]]    # 4-P3/8
  - [-1, 1, DWConvSep, [512, 3, 2]]      # 5-P4/16
  - [-1, 2, C3k2_Mamba_Block, [512,  True, 1.0, True, True]]    # 6-P4/16 
  - [-1, 1, DWConvSep, [1024, 3, 2]]     # 7-P5/32
  - [-1, 2, C3k2_Mamba_Block, [1024, True, 1.0, True, True]]   # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]]             # 9

# Neck
head:
  - [-1, 1, DWConvSep, [512, 1, 1]]      # 10
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]            # 12
  - [-1, 2, C3k2_Mamba_Block, [512,  False, 1.0, True, True]]   # 13

  - [-1, 1, DWConvSep, [256, 1, 1]]      # 14
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 4], 1, Concat, [1]]            # 16
  - [-1, 2, C3k2_Mamba_Block, [256,  False, 1.0, True, True]]   # 17

  - [-1, 1, DWConvSep, [256, 3, 2]]      # 18
  - [[-1, 14], 1, Concat, [1]]           # 19
  - [-1, 2, C3k2_Mamba_Block, [512,  False, 1.0, True, True]]   # 20

  - [-1, 1, DWConvSep, [512, 3, 2]]      # 21
  - [[-1, 10], 1, Concat, [1]]           # 22
  - [-1, 2, C3k2_Mamba_Block, [1024, False, 1.0, True, True]]  # 23

  - [[17, 20, 23], 1, Detect, [nc]]
